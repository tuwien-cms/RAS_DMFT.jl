# https://documenter.juliadocs.org/stable/man/hosting/#GitHub-Actions
name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # read private Fermions.jl
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: tuwien-cms
          repositories: Fermions.jl
      - name: Authenticate private dependencies
        run: >-
          git config --global
          url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/tuwien-cms/".insteadOf
          "https://github.com/tuwien-cms/"
      - name: add Fermions.jl
        run: |
          julia --project -e '
            using Pkg
            Pkg.add(url="https://github.com/tuwien-cms/Fermions.jl", rev="main")
          '
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
